<!DOCTYPE html>
<html>
<head>
    <title>Email Sent - Miyabala Pharmacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #166534; margin-bottom: 15px; font-size: 24px; }
        p { color: #64748b; margin-bottom: 25px; font-size: 15px; line-height: 1.5; }
        .btn { display: inline-block; padding: 15px 30px; background: #0f172a; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; text-decoration: none; transition: 0.3s; }
        .btn:hover { background: #1e293b; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <h2>Check your inbox</h2>
        <p>We've emailed you instructions for setting your password. You should receive the email shortly!</p>
        <a href="{% url 'stock:login' %}" class="btn">Return to Login</a>
    </div>
</body>
</html>
