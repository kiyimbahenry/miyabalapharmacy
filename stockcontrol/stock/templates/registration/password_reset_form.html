<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - Miyabala Pharmacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #0369a1; margin-bottom: 15px; font-size: 24px; }
        p { color: #64748b; margin-bottom: 25px; font-size: 15px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; color: #334155; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        .input-group input { width: 100%; padding: 15px; border: 1px solid #e2e8f0; border-radius: 10px; background-color: #f8fafc; font-size: 15px; }
        .input-group input:focus { outline: none; border-color: #38bdf8; background-color: #fff; box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1); }
        .btn { width: 100%; padding: 15px; background: #0f172a; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background: #1e293b; transform: translateY(-2px); }
        .back-link { display: block; margin-top: 20px; color: #0369a1; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reset Your Password</h2>
        <p>Enter your email address below, and we'll email instructions for setting a new one.</p>
        <form method="post">
            {% csrf_token %}
            <div class="input-group">
                <label for="id_email">Email Address</label>
                <input type="email" name="email" id="id_email" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="btn">Send Reset Link</button>
        </form>
        <a href="{% url 'stock:login' %}" class="back-link">Back to Login</a>
    </div>
</body>
</html>
