<!DOCTYPE html>
<html>
<head>
    <title>Set New Password - Miyabala Pharmacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #0369a1; margin-bottom: 20px; font-size: 24px; text-align: center; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; color: #334155; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        .input-group input { width: 100%; padding: 15px; border: 1px solid #e2e8f0; border-radius: 10px; background-color: #f8fafc; font-size: 15px; }
        .input-group input:focus { outline: none; border-color: #38bdf8; background-color: #fff; }
        .btn { width: 100%; padding: 15px; background: #0f172a; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background: #1e293b; transform: translateY(-2px); }
        .error { color: #991b1b; background: #fee2e2; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        {% if validlink %}
            <h2>Enter New Password</h2>
            <form method="post">
                {% csrf_token %}
                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" name="new_password1" required>
                </div>
                <div class="input-group">
                    <label>Confirm New Password</label>
                    <input type="password" name="new_password2" required>
                </div>
                <button type="submit" class="btn">Change My Password</button>
            </form>
        {% else %}
            <h2 style="color: #dc2626;">Invalid Link</h2>
            <div class="error">
                The password reset link was invalid, possibly because it has already been used. Please request a new password reset.
            </div>
            <a href="{% url 'password_reset' %}" class="btn" style="text-align: center; text-decoration: none; display: block;">Request New Link</a>
        {% endif %}
    </div>
</body>
</html>
