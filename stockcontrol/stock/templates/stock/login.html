{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Miyabala Pharmacy</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            height: 600px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* =========================================
           LEFT SIDE: IMAGE & BRANDING
           ========================================= */
        .login-left {
            flex: 1.2;
            position: relative;
            background-color: #e0f2fe;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
        }

        /* The pharmacist image */
        .login-left::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Professional smiling female pharmacist matching your reference */
            background-image: url('https://img.freepik.com/free-photo/portrait-smiling-pharmacist-standing-pharmacy_107420-65297.jpg');
            background-size: cover;
            background-position: center top;
            z-index: 1;
        }

        /* A subtle blue gradient overlay at the bottom so the text pops */
        .login-left::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, rgba(3, 105, 161, 0.9) 0%, rgba(3, 105, 161, 0) 100%);
            z-index: 2;
        }

        .brand-text {
            position: relative;
            z-index: 3;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .brand-text h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .brand-text p {
            font-size: 16px;
            font-weight: 400;
            color: #e0f2fe;
        }

        /* =========================================
           RIGHT SIDE: LOGIN FORM
           ========================================= */
        .login-right {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: #e0f2fe;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-icon i {
            font-size: 28px;
            color: #0369a1;
        }

        .login-right h2 {
            font-size: 28px;
            color: #0369a1; /* Welcome Back is now BLUE */
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-right > p {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* Django Messages */
        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert-success { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .alert-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .alert .close-btn { cursor: pointer; font-size: 18px; font-weight: bold; background: none; border: none; color: inherit; }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background-color: #f8fafc;
            font-size: 15px;
            color: #334155;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #38bdf8;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            color: #64748b;
            cursor: pointer;
        }

        .remember-me input {
            margin-right: 8px;
            cursor: pointer;
        }

        .forgot-password {
            color: #0369a1;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .forgot-password:hover {
            color: #0284c7;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .login-btn:hover {
            background: #1e293b;
            transform: translateY(-2px);
        }

        /* =========================================
           FOOTER / COPYRIGHT
           ========================================= */
        .footer-text {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            background: linear-gradient(90deg, #0369a1, #7c3aed, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                height: auto;
                max-width: 450px;
            }
            .login-left {
                height: 250px;
                padding: 20px;
            }
            .login-left::after {
                height: 100%;
                background: linear-gradient(to top, rgba(3, 105, 161, 0.9) 0%, rgba(3, 105, 161, 0.3) 100%);
            }
            .brand-text h1 { font-size: 24px; }
            .login-right { padding: 30px; }
            .footer-text { position: relative; margin-top: 30px; }
        }
    </style>
</head>
